<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Harian Tim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F3A3A; --ink-soft:#35514F; --paper:#ECE4D0; --paper-light:#F8F4E8;
    --gold:#C9A227; --gold-soft:#E4D293; --brick:#A8503A; --sage:#7C8B6F;
    --line: rgba(31,58,58,0.16); --shadow: 0 8px 24px rgba(31,58,58,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(31,58,58,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink); font-family: 'Inter', sans-serif;
    min-height: 100vh; padding: 32px 16px 64px;
  }
  .wrap{ max-width: 640px; margin: 0 auto; }
  header{ margin-bottom: 24px; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); opacity: 0.65; }
  h1{ font-family:'Fraunces', serif; font-weight: 600; font-size: 32px; line-height: 1.2; margin-top: 4px; }
  h1 em{ font-style: italic; color: var(--gold); font-weight: 500; }
  .subtitle{ font-size: 14px; color: var(--ink-soft); opacity: 0.75; margin-top: 6px; }
  .header-links{ display:flex; gap:16px; margin-top: 14px; }
  .header-links button{
    background:none; border:none; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size: 11px; text-decoration: underline;
    color: var(--ink-soft); opacity: 0.6; padding:0;
  }
  .header-links button:hover{ opacity: 1; }

  /* welcome + setup */
  .card{
    background: var(--paper-light); border: 1px solid var(--line); border-radius: 6px;
    box-shadow: var(--shadow); padding: 28px 26px; margin-top: 24px;
  }
  .field-label{ font-family:'IBM Plex Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); opacity:0.7; margin-bottom: 6px; display:block; }
  input[type="text"]{
    width: 100%; font-family:'Inter', sans-serif; font-size: 15px;
    padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 5px;
    background: var(--paper-light); color: var(--ink); outline: none;
  }
  input[type="text"]:focus{ border-color: var(--gold); }
  .btn-primary{
    font-family:'IBM Plex Mono', monospace; font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--ink); color: var(--paper-light); border: none; border-radius: 5px;
    padding: 12px 20px; cursor: pointer; margin-top: 18px;
  }
  .btn-primary:hover{ background: var(--ink-soft); }
  .item-row{ display:flex; gap: 8px; margin-bottom: 8px; align-items:center; }
  .item-row input{ flex:1; }
  .remove-btn{
    background:none; border: 1.5px solid var(--line); border-radius: 5px;
    width: 40px; height: 40px; flex-shrink:0; cursor: pointer; color: var(--brick); font-size: 16px;
  }
  .remove-btn:hover{ background: rgba(168,80,58,0.08); }
  .add-item-btn{
    background:none; border: 1.5px dashed var(--line); border-radius: 5px;
    width: 100%; padding: 10px; cursor: pointer; color: var(--ink-soft);
    font-family:'IBM Plex Mono', monospace; font-size: 12px; margin-top: 4px;
  }
  .add-item-btn:hover{ border-color: var(--gold); color: var(--ink); }
  .hint{ font-size: 12.5px; color: var(--ink-soft); opacity: 0.6; margin-top: 10px; line-height: 1.5; }

  /* tabs */
  .tabs{ display:flex; gap: 4px; margin-top: 22px; border-bottom: 1px solid var(--line); }
  .tab-btn{ font-family:'IBM Plex Mono', monospace; font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase; background: none; border: none; color: var(--ink-soft); opacity: 0.55; padding: 10px 4px; margin-right: 22px; cursor: pointer; position: relative; }
  .tab-btn:hover{ opacity: 0.85; }
  .tab-btn.active{ opacity: 1; color: var(--ink); }
  .tab-btn.active::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height: 2px; background: var(--gold); }

  /* sheet */
  .sheet{ background: var(--paper-light); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); margin-top: 24px; position: relative; overflow: hidden; }
  .perforation{ display:flex; justify-content: space-between; padding: 12px 18px 0; }
  .perforation span{ width:6px; height:6px; border-radius:50%; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
  .sheet-inner{ padding: 22px 26px 26px; }
  .sheet-top{ display:flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .date-block .dow{ font-family:'Fraunces', serif; font-size: 20px; font-weight: 600; }
  .date-block .full-date{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); opacity: 0.7; margin-top: 2px; }
  .progress-tag{ font-family:'IBM Plex Mono', monospace; font-size: 12px; background: var(--ink); color: var(--paper-light); padding: 6px 12px; border-radius: 20px; }
  .habit-list{ display:flex; flex-direction:column; gap: 2px; }
  .habit-row{ display:flex; align-items:center; gap: 14px; padding: 13px 8px; border-bottom: 1px dashed var(--line); cursor: pointer; user-select: none; }
  .habit-row:last-child{ border-bottom: none; }
  .habit-row:hover{ background: rgba(201,162,39,0.06); }
  .checkbox{ width: 22px; height: 22px; flex-shrink:0; border: 1.5px solid var(--ink-soft); border-radius: 5px; display:flex; align-items:center; justify-content:center; }
  .habit-row.done .checkbox{ background: var(--gold); border-color: var(--gold); }
  .checkbox svg{ width:14px; height:14px; opacity:0; transform: scale(0.6); transition: all 0.15s; }
  .habit-row.done .checkbox svg{ opacity:1; transform: scale(1); }
  .habit-label{ font-size: 15px; font-weight: 500; flex: 1; }
  .habit-row.done .habit-label{ opacity: 0.55; text-decoration: line-through; text-decoration-color: var(--gold); text-decoration-thickness: 1.5px; }
  .habit-streak{ font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--sage); opacity: 0.85; min-width: 40px; text-align:right; }
  .stamp{ position:absolute; top: 60px; right: 26px; border: 3px double var(--brick); color: var(--brick); font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 14px; border-radius: 6px; transform: rotate(-9deg); opacity: 0.85; mix-blend-mode: multiply; pointer-events:none; text-align:center; line-height:1.4; }

  /* dashboard */
  .dash-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 24px; }
  .stat-card{ background: var(--paper-light); border:1px solid var(--line); border-radius: 4px; padding: 14px 12px; box-shadow: var(--shadow); }
  .stat-num{ font-family:'Fraunces', serif; font-size: 26px; font-weight:600; color: var(--ink); }
  .stat-label{ font-family:'IBM Plex Mono', monospace; font-size: 10px; text-transform:uppercase; letter-spacing:0.06em; color: var(--ink-soft); opacity:0.65; margin-top:4px; }
  .panel{ background: var(--paper-light); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); margin-top: 18px; padding: 20px 22px; }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; }
  .panel-title{ font-family:'Fraunces', serif; font-size: 18px; font-weight: 600; }
  .month-nav{ display:flex; align-items:center; gap: 10px; }
  .month-nav button{ background:none; border: 1px solid var(--line); border-radius: 4px; width: 26px; height: 26px; cursor:pointer; color: var(--ink); font-size: 14px; line-height:1; }
  .month-nav span{ font-family:'IBM Plex Mono', monospace; font-size: 12px; min-width: 90px; text-align:center; }
  .cal-weekdays, .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-weekdays div{ font-family:'IBM Plex Mono', monospace; font-size: 10px; text-align:center; color: var(--ink-soft); opacity:0.55; padding-bottom: 4px; }
  .cal-cell{ aspect-ratio: 1; border-radius: 4px; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink); border: 1px solid var(--line); }
  .cal-cell.empty{ border: none; }
  .cal-cell.today{ box-shadow: 0 0 0 1.5px var(--brick) inset; font-weight:600; }
  .habit-bars{ display:flex; flex-direction:column; gap: 12px; }
  .bar-row{ display:flex; align-items:center; gap: 12px; }
  .bar-label{ font-size: 13px; width: 130px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track{ flex:1; height: 8px; background: var(--paper); border-radius: 5px; overflow:hidden; }
  .bar-fill{ height:100%; background: var(--sage); border-radius: 5px; transition: width 0.4s ease; }
  .bar-pct{ font-family:'IBM Plex Mono', monospace; font-size: 11px; width: 34px; text-align:right; color: var(--ink-soft); }
  .reset-link{ display:block; text-align:center; margin-top: 22px; font-family:'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); opacity: 0.45; text-decoration: underline; cursor:pointer; background:none; border:none; }
  .reset-link:hover{ opacity: 0.8; }
  .empty-note{ font-size:13px; color: var(--ink-soft); opacity:0.6; text-align:center; padding: 10px 0; }
  .sync-note{ font-family:'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); opacity:0.55; text-align:right; margin-top:6px; }
  .setup-banner{ background: var(--brick); color: var(--paper-light); padding: 14px 18px; border-radius: 4px; margin-bottom: 18px; font-size: 13px; line-height:1.5; }
  .setup-banner code{ background: rgba(255,255,255,0.15); padding: 1px 5px; border-radius: 3px; }
  .error-msg{ color: var(--brick); font-size: 12.5px; margin-top: 8px; }
  @media (max-width: 480px){
    .dash-grid{ grid-template-columns: repeat(2,1fr); }
    h1{ font-size: 26px; }
    .sheet-inner{ padding: 18px 16px 22px; }
    .card{ padding: 22px 18px; }
    .stamp{ top: 50px; right: 12px; font-size: 10px; padding: 8px 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="page-title">Buku Harian <em>Tim</em></h1>
    <div class="subtitle" id="page-subtitle">Isi nama dan checklist harianmu sendiri di bawah.</div>
    <div class="header-links" id="header-links" style="display:none;">
      <button onclick="goToSetup()">Ubah checklist</button>
      <button onclick="goToWelcome()">Ganti pengguna</button>
    </div>
    <div class="tabs" id="tabs" style="display:none;">
      <button class="tab-btn active" data-tab="today">Hari Ini</button>
      <button class="tab-btn" data-tab="dashboard">Dashboard</button>
    </div>
  </header>
  <div id="setup-banner-slot"></div>
  <div id="welcome-view"></div>
  <div id="setup-view" style="display:none;"></div>
  <div id="today-view" style="display:none;"></div>
  <div id="dashboard-view" style="display:none;"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ======================================================
// GANTI NILAI DI BAWAH INI DENGAN FIREBASE CONFIG KAMU
// (lihat README-setup.md untuk cara mendapatkannya)
// ======================================================
const firebaseConfig = {
  apiKey: "AIzaSyCy2-S0ibQINwWLvIYlgOWMUGgp5T8vfoU",
  authDomain: "checklist-ana.firebaseapp.com",
  projectId: "checklist-ana",
  storageBucket: "checklist-ana.firebasestorage.app",
  messagingSenderId: "730735893736",
  appId: "1:730735893736:web:d430eb63646ca814f5fd5d"
};
// ======================================================

const isConfigured = !firebaseConfig.apiKey.includes("PASTE_");
let db;
if(isConfigured){
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
} else {
  document.getElementById('setup-banner-slot').innerHTML = `
    <div class="setup-banner">
      ⚠ Firebase belum dikonfigurasi. Cari <code>firebaseConfig</code> di bagian &lt;script&gt; file ini
      dan tempel config project Firebase kamu. Lihat <code>README-setup.md</code>.
    </div>`;
}

const DOW = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const DOW_SHORT = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

let profile = null;       // { name, slug, habits:[{key,label}], entries:{} }
let mode = 'welcome';     // welcome | setup | app
let activeTab = 'today';
let viewMonth = new Date();
let syncState = 'idle';
let setupItems = [];      // temp state while editing checklist items

function pad(n){ return n < 10 ? '0'+n : ''+n; }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayKey(){ return fmtDate(new Date()); }
function slugify(s){ return s.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'user'; }
function uid(){ return Math.random().toString(36).slice(2,9); }

function docRefFor(slug){ return doc(db, "profiles", slug); }

async function loadProfile(slug){
  syncState = 'syncing';
  try{
    const snap = await getDoc(docRefFor(slug));
    if(snap.exists()){
      const p = snap.data();
      if(!p.entries) p.entries = {};
      if(!p.habits) p.habits = [];
      syncState = 'synced';
      return p;
    }
    syncState = 'synced';
    return null;
  }catch(e){
    console.error('Gagal memuat profil', e);
    syncState = 'error';
    return null;
  }
}

async function saveProfile(){
  if(!isConfigured || !profile) return;
  syncState = 'syncing';
  try{
    await setDoc(docRefFor(profile.slug), profile);
    syncState = 'synced';
  }catch(e){
    console.error('Gagal menyimpan', e);
    syncState = 'error';
  }
  renderSyncNote();
}

function renderSyncNote(){
  const label = { idle:'', syncing:'Menyimpan…', synced:'Tersimpan di cloud ✓', error:'Gagal sinkron — cek koneksi' }[syncState];
  const noteEl = document.getElementById('sync-note');
  if(noteEl) noteEl.textContent = label;
}

/* ---------- WELCOME ---------- */
function renderWelcome(){
  setViewVisibility('welcome');
  document.getElementById('page-title').innerHTML = 'Buku Harian <em>Tim</em>';
  document.getElementById('page-subtitle').textContent = 'Isi nama dan checklist harianmu sendiri di bawah.';
  document.getElementById('header-links').style.display = 'none';
  document.getElementById('tabs').style.display = 'none';

  const savedName = localStorage.getItem('last-name') || '';
  const el = document.getElementById('welcome-view');
  el.innerHTML = `
    <div class="card">
      <label class="field-label">Nama kamu</label>
      <input type="text" id="name-input" placeholder="misal: David" value="${savedName}">
      <div id="welcome-error" class="error-msg"></div>
      <button class="btn-primary" id="welcome-continue">Mulai / Lanjutkan</button>
      <div class="hint">Kalau nama ini sudah pernah dipakai sebelumnya, checklist dan riwayatmu akan otomatis terbuka lagi. Kalau baru, kamu akan diminta membuat checklist harianmu sendiri.</div>
    </div>
  `;
  document.getElementById('welcome-continue').addEventListener('click', handleWelcomeContinue);
  document.getElementById('name-input').addEventListener('keydown', e => { if(e.key === 'Enter') handleWelcomeContinue(); });
}

async function handleWelcomeContinue(){
  const nameInput = document.getElementById('name-input');
  const name = nameInput.value.trim();
  const errorEl = document.getElementById('welcome-error');
  if(!name){ errorEl.textContent = 'Nama tidak boleh kosong.'; return; }
  errorEl.textContent = '';
  const slug = slugify(name);
  localStorage.setItem('last-name', name);

  if(!isConfigured){
    profile = { name, slug, habits: [], entries: {} };
    mode = 'setup'; setupItems = [{id:uid(), label:''}];
    renderSetup();
    return;
  }

  document.getElementById('welcome-continue').textContent = 'Memuat…';
  const existing = await loadProfile(slug);
  if(existing){
    profile = existing;
    profile.name = name;
    mode = 'app'; activeTab = 'today';
    renderApp();
  } else {
    profile = { name, slug, habits: [], entries: {} };
    mode = 'setup';
    setupItems = [{id:uid(), label:''},{id:uid(), label:''},{id:uid(), label:''}];
    renderSetup();
  }
}

/* ---------- SETUP (checklist builder) ---------- */
function renderSetup(){
  setViewVisibility('setup');
  document.getElementById('page-title').innerHTML = `Halo, <em>${profile.name}</em>`;
  document.getElementById('page-subtitle').textContent = 'Buat daftar checklist harianmu. Tambah atau hapus item sesuai kebutuhan.';
  document.getElementById('header-links').style.display = profile.habits.length ? 'flex' : 'none';
  document.getElementById('tabs').style.display = 'none';

  const el = document.getElementById('setup-view');
  el.innerHTML = `
    <div class="card">
      <label class="field-label">Item checklist</label>
      <div id="item-rows"></div>
      <button class="add-item-btn" id="add-item-btn">+ Tambah item</button>
      <div id="setup-error" class="error-msg"></div>
      <button class="btn-primary" id="setup-save">Simpan checklist</button>
      <div class="hint">Contoh: Bersyukur, To-do List, Workout, Membaca, Bekerja, Relax, Meditasi, Laporan Keuangan &mdash; atau buat daftar sendiri sesuai rutinitasmu.</div>
    </div>
  `;
  renderItemRows();
  document.getElementById('add-item-btn').addEventListener('click', () => {
    setupItems.push({id:uid(), label:''});
    renderItemRows();
  });
  document.getElementById('setup-save').addEventListener('click', handleSaveSetup);
}

function renderItemRows(){
  const rows = document.getElementById('item-rows');
  rows.innerHTML = setupItems.map(item => `
    <div class="item-row" data-id="${item.id}">
      <input type="text" placeholder="Nama item checklist" value="${item.label.replace(/"/g,'&quot;')}">
      <button class="remove-btn" data-remove="${item.id}">×</button>
    </div>
  `).join('');
  rows.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => {
      const id = inp.closest('.item-row').dataset.id;
      const item = setupItems.find(i => i.id === id);
      if(item) item.label = inp.value;
    });
  });
  rows.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      setupItems = setupItems.filter(i => i.id !== btn.dataset.remove);
      if(setupItems.length === 0) setupItems.push({id:uid(), label:''});
      renderItemRows();
    });
  });
}

async function handleSaveSetup(){
  const labels = setupItems.map(i => i.label.trim()).filter(Boolean);
  const errorEl = document.getElementById('setup-error');
  if(labels.length === 0){ errorEl.textContent = 'Tambahkan minimal satu item checklist.'; return; }
  errorEl.textContent = '';

  // preserve existing habit keys where label matches an existing habit (to keep streak history)
  const existingByLabel = {};
  (profile.habits || []).forEach(h => { existingByLabel[h.label] = h.key; });
  profile.habits = labels.map(label => ({
    key: existingByLabel[label] || (slugify(label) + '-' + uid()),
    label
  }));

  document.getElementById('setup-save').textContent = 'Menyimpan…';
  await saveProfile();
  mode = 'app'; activeTab = 'today';
  renderApp();
}

function goToSetup(){
  setupItems = (profile.habits.length ? profile.habits : [{key:'', label:''}]).map(h => ({id:uid(), label:h.label}));
  mode = 'setup';
  renderSetup();
}
window.goToSetup = goToSetup;

function goToWelcome(){
  profile = null; mode = 'welcome'; activeTab = 'today';
  renderWelcome();
}
window.goToWelcome = goToWelcome;

/* ---------- APP (today + dashboard) ---------- */
function setViewVisibility(view){
  document.getElementById('welcome-view').style.display = view === 'welcome' ? 'block' : 'none';
  document.getElementById('setup-view').style.display = view === 'setup' ? 'block' : 'none';
  document.getElementById('today-view').style.display = (view === 'app' && activeTab === 'today') ? 'block' : 'none';
  document.getElementById('dashboard-view').style.display = (view === 'app' && activeTab === 'dashboard') ? 'block' : 'none';
}

function renderApp(){
  setViewVisibility('app');
  document.getElementById('page-title').innerHTML = `Halo, <em>${profile.name}</em>`;
  document.getElementById('page-subtitle').textContent = 'Catat rutinitas harianmu dan lihat perkembanganmu dari waktu ke waktu.';
  document.getElementById('header-links').style.display = 'flex';
  document.getElementById('tabs').style.display = 'flex';
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
  renderToday();
  if(activeTab === 'dashboard') renderDashboard();
}

function getEntry(dateKey){ return (profile.entries[dateKey]) || {}; }
function completionCount(entry){ return profile.habits.reduce((sum,h)=> sum + (entry[h.key] ? 1 : 0), 0); }

function computeStreak(habitKey){
  let count = 0; let d = new Date();
  while(true){
    const key = fmtDate(d);
    const entry = profile.entries[key];
    if(entry && entry[habitKey]){ count++; d.setDate(d.getDate()-1); } else break;
  }
  return count;
}

function computePerfectStreaks(){
  const total = profile.habits.length;
  if(total === 0) return {current:0, longest:0};
  const dates = Object.keys(profile.entries).sort();
  let longest = 0, run = 0, prevDate = null;
  for(const key of dates){
    const entry = profile.entries[key];
    const isPerfect = completionCount(entry) === total;
    if(isPerfect){
      if(prevDate){
        const diffDays = Math.round((new Date(key) - new Date(prevDate)) / 86400000);
        run = diffDays === 1 ? run + 1 : 1;
      } else run = 1;
      longest = Math.max(longest, run);
      prevDate = key;
    } else { run = 0; prevDate = null; }
  }
  let current = 0; let d = new Date();
  while(true){
    const key = fmtDate(d);
    const entry = profile.entries[key];
    if(entry && completionCount(entry) === total){ current++; d.setDate(d.getDate()-1); } else break;
  }
  return { current, longest };
}

function avgCompletion30(){
  const total = profile.habits.length;
  if(total === 0) return 0;
  let d = new Date(); let sum = 0, count = 0;
  for(let i=0;i<30;i++){
    const key = fmtDate(d);
    if(profile.entries[key]){ sum += completionCount(profile.entries[key]); count++; }
    d.setDate(d.getDate()-1);
  }
  if(count === 0) return 0;
  return Math.round((sum / (count * total)) * 100);
}

function habitPercent30(habitKey){
  let d = new Date(); let total = 0, done = 0;
  for(let i=0;i<30;i++){
    const key = fmtDate(d);
    if(profile.entries[key]){ total++; if(profile.entries[key][habitKey]) done++; }
    d.setDate(d.getDate()-1);
  }
  if(total === 0) return 0;
  return Math.round((done/total)*100);
}

window.toggleHabit = function(habitKey){
  const key = todayKey();
  if(!profile.entries[key]) profile.entries[key] = {};
  profile.entries[key][habitKey] = !profile.entries[key][habitKey];
  renderToday();
  if(activeTab === 'dashboard') renderDashboard();
  saveProfile();
};

function renderToday(){
  const el = document.getElementById('today-view');
  const key = todayKey();
  const entry = getEntry(key);
  const now = new Date();
  const done = completionCount(entry);
  const total = profile.habits.length;
  const isPerfect = total > 0 && done === total;

  if(total === 0){
    el.innerHTML = `<div class="sheet"><div class="sheet-inner"><div class="empty-note">Belum ada item checklist. Klik "Ubah checklist" untuk menambahkannya.</div></div></div>`;
    return;
  }

  const rows = profile.habits.map(h => `
    <div class="habit-row ${entry[h.key] ? 'done' : ''}" onclick="toggleHabit('${h.key}')">
      <div class="checkbox"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="habit-label">${h.label}</div>
      <div class="habit-streak">${computeStreak(h.key)}h beruntun</div>
    </div>
  `).join('');

  el.innerHTML = `
    <div class="sheet">
      <div class="perforation">${'<span></span>'.repeat(14)}</div>
      <div class="sheet-inner">
        ${isPerfect ? `<div class="stamp">Hari<br>Sempurna</div>` : ''}
        <div class="sheet-top">
          <div class="date-block">
            <div class="dow">${DOW[now.getDay()]}</div>
            <div class="full-date">${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}</div>
          </div>
          <div class="progress-tag">${done} / ${total} selesai</div>
        </div>
        <div class="habit-list">${rows}</div>
      </div>
    </div>
    <div class="sync-note" id="sync-note"></div>
  `;
  renderSyncNote();
}

function renderDashboard(){
  const el = document.getElementById('dashboard-view');
  const streaks = computePerfectStreaks();
  const avg = avgCompletion30();
  const totalDays = Object.keys(profile.entries).filter(k => completionCount(profile.entries[k]) > 0).length;

  const year = viewMonth.getFullYear();
  const month = viewMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const startOffset = firstDay.getDay();
  const todayStr = todayKey();
  const total = profile.habits.length;

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const key = year+'-'+pad(month+1)+'-'+pad(day);
    const entry = profile.entries[key];
    const c = entry ? completionCount(entry) : 0;
    const ratio = total > 0 ? c / total : 0;
    let bg = 'var(--paper)';
    if(entry && c > 0){
      if(ratio === 1) bg = 'var(--gold)';
      else if(ratio >= 0.5) bg = 'var(--gold-soft)';
      else bg = 'rgba(124,139,111,0.35)';
    }
    const isToday = key === todayStr ? 'today' : '';
    cells += `<div class="cal-cell ${isToday}" style="background:${bg}" title="${c}/${total}">${day}</div>`;
  }
  const weekdayHeaders = DOW_SHORT.map(d => `<div>${d}</div>`).join('');

  const bars = profile.habits.map(h => {
    const pct = habitPercent30(h.key);
    return `
      <div class="bar-row">
        <div class="bar-label">${h.label}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-pct">${pct}%</div>
      </div>
    `;
  }).join('');

  el.innerHTML = `
    <div class="dash-grid">
      <div class="stat-card"><div class="stat-num">${streaks.current}</div><div class="stat-label">Streak sempurna</div></div>
      <div class="stat-card"><div class="stat-num">${streaks.longest}</div><div class="stat-label">Terpanjang</div></div>
      <div class="stat-card"><div class="stat-num">${avg}%</div><div class="stat-label">Rata² 30 hari</div></div>
      <div class="stat-card"><div class="stat-num">${totalDays}</div><div class="stat-label">Hari tercatat</div></div>
    </div>
    <div class="panel">
      <div class="panel-head">
        <div class="panel-title">Kalender</div>
        <div class="month-nav">
          <button onclick="changeMonth(-1)">&larr;</button>
          <span>${MONTHS[month]} ${year}</span>
          <button onclick="changeMonth(1)">&rarr;</button>
        </div>
      </div>
      <div class="cal-weekdays">${weekdayHeaders}</div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div class="panel">
      <div class="panel-head"><div class="panel-title">Konsistensi per Item</div></div>
      ${totalDays === 0 ? `<div class="empty-note">Belum ada data. Isi checklist hari ini untuk mulai melacak.</div>` : `<div class="habit-bars">${bars}</div>`}
    </div>
    <button class="reset-link" onclick="resetData()">Hapus riwayat saya</button>
  `;
}

window.changeMonth = function(delta){
  viewMonth.setMonth(viewMonth.getMonth() + delta);
  renderDashboard();
};

window.resetData = async function(){
  if(confirm('Yakin ingin menghapus semua riwayat checklist kamu? Item checklist tetap ada, hanya riwayat centangnya yang dihapus.')){
    profile.entries = {};
    await saveProfile();
    renderToday();
    renderDashboard();
  }
};

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    renderApp();
  });
});

renderWelcome();
</script>
</body>
</html>
